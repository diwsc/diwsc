<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>DiwSc — Script Hub</title>
<style>
*{box-sizing:border-box}
:root{--bg:#090b12;--card:#111722;--card2:#171e2c;--line:#273144;--text:#f5f7fb;--muted:#9aa6b8;--purple:#7c5cff;--green:#5ee7a0}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;color:#fff;font-weight:800}
.top{position:sticky;top:0;z-index:10;background:#090b12ee;border-bottom:1px solid var(--line)}
.nav{max-width:1050px;margin:auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:22px;font-weight:950}.logo b{color:var(--purple)}
.btn{background:var(--purple);padding:12px 16px;border-radius:12px}.btn.dark{background:#273144}
.btn.red{background:#c53f54}.btn.small{padding:8px 10px;border-radius:9px;font-size:12px}
.wrap{max-width:1050px;margin:auto;padding:25px 16px 70px}
.hero{padding:18px 0 10px}.pill{display:inline-block;border:1px solid #40377a;background:#17132e;padding:6px 10px;border-radius:999px;font-size:12px}
h1{font-size:clamp(32px,7vw,52px);line-height:1.02;margin:15px 0 10px}h1 span{color:#8d7aff}
.hero p{color:var(--muted);line-height:1.55;max-width:700px}
.search{margin:20px 0 13px}.search input{width:100%;height:54px;border:1px solid var(--line);background:var(--card);color:#fff;border-radius:13px;padding:0 16px;outline:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}.tab{white-space:nowrap;background:var(--card2);padding:9px 12px;border-radius:10px;color:#dce2eb}.tab.active{background:var(--purple);color:#fff}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#f0f2f5;color:#151923;border-radius:15px;overflow:hidden;border:1px solid #d8dce3}
.cover{height:150px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#30235d,#171e2c);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}.coverIcon{position:relative;font-size:58px}
.coverGame{position:absolute;left:10px;bottom:9px;color:#fff;text-shadow:0 2px 6px #000;font-weight:900}
.body{padding:12px}.type{font-size:10px;color:#6d7788;font-weight:850;text-transform:uppercase}
.title{font-size:18px;font-weight:950;margin:5px 0}.desc{font-size:12px;color:#687184;min-height:34px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{grid-column:1/-1;text-align:center;padding:45px 10px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}.box{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.head{display:flex;justify-content:space-between;align-items:center}.x{width:40px;height:40px;border-radius:10px;background:#273144}
.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px;color:#cfd6e1}
.field input,.field textarea,.field select{width:100%;background:#0d121b;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px;outline:none}
.field textarea{min-height:180px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;z-index:200;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:11px 14px;border-radius:10px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.grid{grid-template-columns:1fr;gap:9px}.cover{height:120px}.coverIcon{font-size:43px}.row{grid-template-columns:1fr}.nav .btn{padding:10px 11px;font-size:12px}}
</style>
</head>
<body>
<header class="top"><div class="nav"><div class="logo">DIW<b>SC</b></div><button class="btn" id="openPublish">＋ Publish Script</button></div></header>
<main class="wrap">
<section class="hero">
<span class="pill">ROBLOX SCRIPT HUB</span>
<h1>DiwSc <span>Script Hub</span></h1>
<p>Tempat menyimpan dan membagikan script Roblox untuk project sendiri. Katalog awal kosong — kamu yang memasukkan script.</p>
</section>
<div class="search"><input id="search" placeholder="Cari script atau nama game..."></div>
<div class="tabs" id="tabs"></div>
<div class="toolbar"><span id="count">0 script</span><button class="btn dark small" id="clearMine">Hapus semua milik saya</button></div>
<section class="grid" id="grid"></section>
</main>

<div class="modal" id="publishModal">
<div class="box">
<div class="head"><h2>Publish Script</h2><button class="x" data-close>×</button></div>
<div class="row">
<div class="field"><label>Nama script</label><input id="fTitle" placeholder="Contoh: My Script"></div>
<div class="field"><label>Nama game</label><input id="fGame" placeholder="Contoh: Racing City"></div>
</div>
<div class="field"><label>Kategori</label><select id="fCat"><option>Roblox</option><option>Simulator</option><option>Tycoon</option><option>Roleplay</option><option>Other</option></select></div>
<div class="field"><label>Link script</label><input id="fLink" placeholder="https://..."></div>
<div class="field"><label>Isi script (opsional)</label><textarea id="fCode" placeholder="Tempel script milik project kamu di sini..."></textarea></div>
<div class="field"><label>Gambar (opsional, maksimal 2,5 MB)</label><input id="fImage" type="file" accept="image/*"></div>
<div class="modalActions"><button class="btn dark" data-close>Batal</button><button class="btn" id="save">Publish</button></div>
</div></div>

<div class="modal" id="viewModal"><div class="box"><div class="head"><h2 id="vTitle"></h2><button class="x" data-close>×</button></div><p id="vGame"></p><pre id="vCode" style="white-space:pre-wrap;background:#090b12;padding:12px;border-radius:10px;overflow:auto"></pre><div class="modalActions"><button class="btn" id="copyView">Copy Script</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY="diwsc_scripts_v9";
let scripts=JSON.parse(localStorage.getItem(KEY)||"[]");
let category="Semua", current=null;

const $=id=>document.getElementById(id);
function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function saveData(){localStorage.setItem(KEY,JSON.stringify(scripts));render();}
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800);}
function open(id){$(id).classList.add("show")}
function closeAll(){document.querySelectorAll(".modal").forEach(x=>x.classList.remove("show"))}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);

function renderTabs(){
 const cats=["Semua",...new Set(scripts.map(x=>x.cat).filter(Boolean))];
 $("tabs").innerHTML=cats.map(c=>`<button class="tab ${c===category?"active":""}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join("");
}
window.setCat=c=>{category=c;render()};

function render(){
 renderTabs();
 const q=$("search").value.toLowerCase().trim();
 const list=scripts.filter(x=>(category==="Semua"||x.cat===category)&&((x.title+" "+x.game+" "+x.cat).toLowerCase().includes(q)));
 $("count").textContent=list.length+" script";
 $("grid").innerHTML=list.length?list.map(x=>`
 <article class="card">
  <div class="cover">${x.image?`<img src="${x.image}" alt="">`:`<div class="coverIcon">🎮</div>`}<div class="coverGame">${esc(x.game)}</div></div>
  <div class="body"><div class="type">${esc(x.cat)}</div><div class="title">${esc(x.title)}</div><div class="desc">${esc(x.link||"Script tersimpan di DiwSc")}</div>
  <div class="actions"><button class="btn small" onclick="view('${x.id}')">Lihat</button><button class="btn dark small" onclick="copy('${x.id}')">Copy</button><button class="btn red small" onclick="delScript('${x.id}')">🗑 Hapus</button></div></div>
 </article>`).join(""):`<div class="empty"><h3>Belum ada script</h3><p>Gunakan tombol <b>＋ Publish Script</b> untuk menambahkan script kamu sendiri.</p></div>`;
}
window.view=id=>{const x=scripts.find(s=>s.id===id);if(!x)return;current=x;$("vTitle").textContent=x.title;$("vGame").textContent="Game: "+x.game;$("vCode").textContent=x.code||x.link||"Tidak ada isi script.";open("viewModal")};
window.copy=async id=>{const x=scripts.find(s=>s.id===id);if(!x)return;await navigator.clipboard?.writeText(x.code||x.link||"");toast("Script disalin");};
window.delScript=id=>{
 const x=scripts.find(s=>s.id===id);if(!x)return;
 if(confirm(`Hapus "${x.title}"?`)){scripts=scripts.filter(s=>s.id!==id);saveData();toast("Script dihapus");}
};
$("copyView").onclick=()=>{if(current)navigator.clipboard?.writeText(current.code||current.link||"").then(()=>toast("Script disalin"))};
$("search").oninput=render;

$("openPublish").onclick=()=>open("publishModal");
$("save").onclick=async()=>{
 const title=$("fTitle").value.trim(),game=$("fGame").value.trim(),link=$("fLink").value.trim(),code=$("fCode").value;
 if(!title||!game){toast("Nama script dan game wajib diisi");return}
 let image="";
 const file=$("fImage").files[0];
 if(file){if(file.size>2.5*1024*1024){toast("Gambar maksimal 2,5 MB");return}image=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
 scripts.unshift({id:Date.now().toString(36),title,game,cat:$("fCat").value,link,code,image,created:Date.now()});
 localStorage.setItem(KEY,JSON.stringify(scripts));
 ["fTitle","fGame","fLink","fCode"].forEach(id=>$(id).value="");$("fImage").value="";closeAll();render();toast("Script berhasil dipublish");
};
$("clearMine").onclick=()=>{
 if(!scripts.length){toast("Belum ada script");return}
 if(confirm("Hapus semua script yang tersimpan di browser ini?")){scripts=[];saveData();toast("Semua script dihapus")}
};
render();
</script>
</body>
</html>
