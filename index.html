<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090b12">
    <title>DiwSc - Script Hub</title>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. BAGIAN FORMULIR TAMBAH SCRIPT (HTML) -->
    <!-- Cari modal admin Anda, lalu sesuaikan bagian inputnya menjadi seperti ini -->
    <!-- ========================================== -->
    <div class="field">
        <label>Nama script</label>
        <input id="fTitle" placeholder="Contoh: Blade Ball Hub">
    </div>
    
    <div class="field">
        <label>Nama game</label>
        <input id="fGame" placeholder="Contoh: Roblox">
    </div>

    <div class="field">
        <label>Kategori</label>
        <select id="fCat">
            <option value="Roblox">Roblox</option>
            <option value="Simulator">Simulator</option>
            <option value="Tycoon">Tycoon</option>
            <option value="Roleplay">Roleplay</option>
            <option value="Other">Other</option>
        </select>
    </div>

    <div class="field">
        <label>Link script</label>
        <input id="fLink" placeholder="https://...">
    </div>

    <!-- PENTING: SEBARIS KODE BARU UNTUK INPUT GALERI DI BARIS 103 -->
    <div class="field">
        <label>Gambar Ikon Script (Unggah dari Galeri)</label>
        <input type="file" id="fFile" accept="image/*" style="padding:5px;background:#222;border:1px solid #444;border-radius:6px;width:100%;color:#fff;">
        <input type="hidden" id="fImg">
        <div id="uploadStatus" style="color:#aaa;font-size:12px;margin-top:5px;"></div>
    </div>

    <textarea id="fCode" placeholder="Tempel script..."></textarea>


    <script>
    // ==========================================
    // 2. LOGIKA UNGGAH GALERI OTOMATIS (JAVASCRIPT)
    // Pasang fungsi ini tepat di atas $("#saveScript").onclick
    // ==========================================
    $("#fFile").onchange = function() {
      const file = this.files[0];
      if (!file) return;
      
      const status = $("#uploadStatus");
      status.innerText = "Mengunggah gambar... Mohon tunggu.";
      
      const formData = new FormData();
      formData.append("image", file);
      
      fetch("https://api.imgur.com/3/image", {
        method: "POST",
        headers: { Authorization: "Client-ID 6634796695bdf5e" },
        body: formData
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          $("#fImg").value = res.data.link; // Link imgur otomatis tersimpan di fImg
          status.innerHTML = "<span style='color:#4caf50;'>Gambar dari galeri berhasil dipasang!</span>";
        } else {
          status.innerHTML = "<span style='color:#f44336;'>Gagal mengunggah gambar.</span>";
        }
      })
      .catch(() => {
        status.innerHTML = "<span style='color:#f44336;'>Eror koneksi ke server gambar.</span>";
      });
    };


    // ==========================================
    // 3. FUNGSI TAMPILAN KARTU / CARD (JAVASCRIPT)
    // Ganti fungsi card(x, admin) lama Anda dengan versi di bawah ini
    // ==========================================
    function card(x,admin=false){
      let btn = '<button class="btn small primary" ';
      btn += `onclick="viewScript('${x.id}')">Lihat</button>`;
      if(admin){
        btn += `<button class="btn small" `;
        btn += `onclick="editScript('${x.id}')">Edit</button>`;
        btn += `<button class="btn small danger" `;
        btn += `onclick="deleteScript('${x.id}')">Hapus</button>`;
      }
      let im = x.img || 'https://via.placeholder.com/150';
      let html = `<article class="card">`;
      html += `<div class="cover" style="height:120px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;">`;
      html += `<img src="${im}" alt="${esc(x.title)}" style="width:100%;height:100%;object-fit:cover;">`;
      html += `</div>`;
      html += `<div class="body">`;
      html += `<div class="type">${esc(x.cat)}</div>`;
      html += `<h2>${esc(x.title)}</h2>`;
      html += `<p>${esc(x.game)}</p>`;
      html += `</div>`;
      html += `<div class="actions">${btn}</div>`;
      html += `</article>`;
      return html;
    }


    // ==========================================
    // 4. LOGIKA TOMBOL SIMPAN SCRIPT (JAVASCRIPT)
    // Ganti fungsi $("#saveScript").onclick lama Anda dengan ini
    // ==========================================
    $("#saveScript").onclick=()=>{
      if(!isAdmin())return;
      const title=$("#fTitle").value.trim();
      const game=$("#fGame").value.trim();
      const cat=$("#fCat").value;
      const code=$("#fCode").value.trim();
      const img=$("#fImg").value.trim();
      
      if(!title||!game||!code){
        toast("Nama script, game, dan isi script wajib diisi semua!");
        return;
      }
      
      const data={
        title,game,cat,code,
        img:img||"https://via.placeholder.com/150"
      };
      
      if(editId){
        databaseOnline.ref('scripts/'+editId).update(data);
      }else{
        databaseOnline.ref('scripts/').push(data);
      }
      
      $("#fImg").value="";
      $("#fFile").value=""; // Reset pilihan file galeri agar bersih kembali
      closeModal();
    };
    </script>

</body>
</html>
