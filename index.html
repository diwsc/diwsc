<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiwSc â€” Script Hub</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #121212; color: #ffffff; }
        .modal { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; background: #2d2d2d; color: #fff; border: 1px solid #444; border-radius: 4px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; margin-right: 10px; }
        .btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .script-list { margin-top: 20px; }
        .script-item { background: #1e1e1e; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>DiwSc Script Hub</h1>
    <p>Katalog script DiwSc. Pengunjung hanya dapat melihat dan menyalin script.</p>

    <!-- FORM TAMBAH SCRIPT -->
    <div class="modal">
        <h2>Tambah Script</h2>
        <form id="scriptForm">
            <div class="form-group">
                <label>Nama script</label>
                <input type="text" id="namaScript" required>
            </div>
            <div class="form-group">
                <label>Nama game</label>
                <input type="text" id="namaGame" required>
            </div>
            <div class="form-group">
                <label>Kategori</label>
                <select id="kategori">
                    <option value="Roblox">Roblox</option>
                    <option value="Simulator">Simulator</option>
                    <option value="Tycoon">Tycoon</option>
                    <option value="Roleplay">Roleplay</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Link script</label>
                <input type="url" id="linkScript" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Isi script</label>
                <textarea id="isiScript" rows="5" required></textarea>
            </div>
            <div style="text-align: right;">
                <button type="button" class="btn btn-secondary" onclick="resetForm()">Batal</button>
                <!-- PERBAIKAN: Pastikan type="submit" atau panggil fungsi dengan benar, dan pastikan id sesuai -->
                <button type="submit" id="btnSimpan" class="btn btn-primary">Simpan</button>
            </div>
        </form>
    </div>

    <h2>Katalog Script</h2>
    <div id="katalog" class="script-list">
        <!-- Script akan muncul di sini -->
    </div>

    <script>
        // Menggunakan localStorage karena project ini memakai GitHub Pages tanpa server (serverless)
        let scripts = JSON.parse(localStorage.getItem('diwsc_scripts')) || [];

        const scriptForm = document.getElementById('scriptForm');
        const btnSimpan = document.getElementById('btnSimpan');
        const katalogDiv = document.getElementById('katalog');

        // Fungsi untuk menampilkan script ke katalog
        function tampilkanKatalog() {
            katalogDiv.innerHTML = '';
            if (scripts.length === 0) {
                katalogDiv.innerHTML = '<p>0 script tersedia.</p>';
                return;
            }
            
            scripts.forEach((script, index) => {
                const item = document.createElement('div');
                item.className = 'script-item';
                item.innerHTML = `
                    <h3>${script.nama} - <small>${script.game}</small></h3>
                    <p><strong>Kategori:</strong> ${script.kategori}</p>
                    <button class="btn btn-secondary" onclick="copyScript(${index})">Copy Script</button>
                `;
                katalogDiv.appendChild(item);
            });
        }

        // Handle event submit form
        scriptForm.addEventListener('submit', function(event) {
            // 1. Mencegah reload halaman bawaan form browser
            event.preventDefault(); 
            
            // 2. Kunci tombol agar tidak ditekan berulang kali saat proses (opsional)
            btnSimpan.disabled = true;
            btnSimpan.innerText = 'Menyimpan...';

            // 3. Ambil data dari input file/text
            const nama = document.getElementById('namaScript').value;
            const game = document.getElementById('namaGame').value;
            const kategori = document.getElementById('kategori').value;
            const link = document.getElementById('linkScript').value;
            const isi = document.getElementById('isiScript').value;

            // 4. Buat objek data baru
            const newScript = { nama, game, kategori, link, isi };

            try {
                // 5. Simpan ke dalam array dan localStorage
                scripts.push(newScript);
                localStorage.setItem('diwsc_scripts', JSON.stringify(scripts));

                // 6. Reset form dan perbarui tampilan katalog
                scriptForm.reset();
                tampilkanKatalog();
                alert('Script berhasil disimpan!');
            } catch (error) {
                console.error('Gagal menyimpan:', error);
                alert('Gagal menyimpan script.');
            } finally {
                // 7. Kembalikan status tombol simpan agar bisa diklik lagi nantinya
                btnSimpan.disabled = false;
                btnSimpan.innerText = 'Simpan';
            }
        });

        function resetForm() {
            scriptForm.reset();
        }

        function copyScript(index) {
            const scriptText = scripts[index].isi;
            navigator.clipboard.writeText(scriptText).then(() => {
                alert('Script berhasil disalin ke clipboard!');
            }).catch(err => {
                alert('Gagal menyalin script: ' + err);
            });
        }

        // Jalankan saat pertama kali halaman dimuat
        tampilkanKatalog();
    </script>
</body>
</html>
